name: forgame
description: >-
  Forgame Holdings Limited (HKEX 00484) is a Hong Kong-listed technology holding company founded in
  2009 and headquartered in Shenzhen, China. It operates across cloud/light gaming, fintech, electronic
  trade, and cloud storage. Its web and mobile game publishing platform 91wan, run by PRC entity
  Guangzhou Weidong Internet Technology Co., Ltd., has distributed over 100 web games and attracted more
  than 200 million registered players. In 2016 the group obtained an internet micro-lending (fintech)
  license in the PRC, and since 2019 has explored e-sports and virtual-reality games. Forgame is
  tracked by API Evangelist as a portfolio company of Qiming Venture Partners; no public developer API
  or documentation surface was found during enrichment.
